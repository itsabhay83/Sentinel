# TEMPLATE ONLY — never commit a filled-in copy of this file.
#
# Create the real Secret out of band, from a secrets manager or by hand:
#
#   kubectl -n sentinel create secret generic sentinel-secrets \
#     --from-literal=DATABASE_URL="postgresql://…" \
#     --from-literal=REDIS_URL="rediss://…" \
#     --from-literal=ENCRYPTION_KEY="$(openssl rand -hex 32)" \
#     --from-literal=BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=API_KEY_HMAC_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=RESEND_API_KEY="…" \
#     --from-literal=SENTRY_DSN=""
#
# Rotating API_KEY_HMAC_SECRET invalidates every API key already issued.
# See docs/runbook.md before touching it.
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: sentinel
type: Opaque
stringData:
  DATABASE_URL: "<managed-postgres-connection-string>"
  REDIS_URL: "<managed-redis-connection-string>"
  ENCRYPTION_KEY: "<64-hex-characters>"
  BETTER_AUTH_SECRET: "<random-32-bytes-base64url>"
  API_KEY_HMAC_SECRET: "<random-32-bytes-base64url-or-empty>"
  RESEND_API_KEY: "<resend-api-key-or-empty>"
  SENTRY_DSN: ""
