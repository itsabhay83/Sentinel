# The scheduler is safe to scale past 1: dispatch claims monitors with
# FOR UPDATE SKIP LOCKED, and housekeeping (partition rotation, rollups,
# retention) sits behind a Redis leader lock so exactly one replica performs it.
# Two replicas is the right default — one for availability, and the follower
# costs almost nothing because it only dispatches.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-scheduler
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/component: scheduler
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel
        app.kubernetes.io/component: scheduler
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 40
      containers:
        - name: scheduler
          image: ghcr.io/example-org/sentinel/scheduler:latest
          ports:
            - name: health
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: sentinel-config
            - secretRef:
                name: sentinel-secrets
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-scheduler
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/component: scheduler
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/component: scheduler
  ports:
    - name: health
      port: 4000
      targetPort: health
