name: Bug report
description: Something behaves differently from what it documents.
labels: [bug]

body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact command or request, and the response you got.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - web (dashboard / REST API / status pages)
        - scheduler (dispatch, consensus, alerting)
        - probe (check execution)
        - db (schema, migrations, partitions)
        - deploy / CI
        - not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit SHA
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets. `docker compose logs --tail 200 <service>` is usually enough.
      render: shell
